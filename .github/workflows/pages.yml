# Publishes demo/ to GitHub Pages, with the built library copied in beside it.
#
# The library is copied rather than loaded from a CDN on purpose: `demo/index.html` resolves
# `@componentor/fs` through an import map pointing at `/vendor/`, and serving it same-origin keeps
# the demo working regardless of what any CDN is doing that day.
#
# Pages cannot send COOP/COEP, so the synchronous API is switched on client-side by
# demo/coi-serviceworker.js instead — which is also the demo's point: it shows the workaround
# working on a host that cannot set headers.
# Action majors are kept current deliberately: GitHub retires the Node runtime older actions
# target (Node 20 was deprecated in 2025), and a workflow left on old majors starts warning and
# eventually stops running. checkout@v7, setup-node@v5 and deploy-pages@v5 all run on Node 24;
# upload-pages-artifact@v5 is a composite that delegates to upload-artifact@v7, which does too —
# that transitive one is what the Node 20 warning was actually about.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-deployed Pages site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          # 24, not 22: the surface suites derive their expectations from the *running* Node
          # (`Utf8Stream` exists only from 24), so CI should build and test on the version the
          # claims were measured against.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the library
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          mkdir -p _site/vendor
          cp -r dist/. _site/vendor/
          # Pages runs Jekyll by default, which strips files and folders beginning with `_`.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
