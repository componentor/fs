# Publishes demo/ to GitHub Pages, with the built library copied in beside it.
#
# The library is copied rather than loaded from a CDN on purpose: `demo/index.html` resolves
# `@componentor/fs` through an import map pointing at `/vendor/`, and serving it same-origin keeps
# the demo working regardless of what any CDN is doing that day.
#
# Pages cannot send COOP/COEP, so the synchronous API is switched on client-side by
# demo/coi-serviceworker.js instead — which is also the demo's point: it shows the workaround
# working on a host that cannot set headers.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-deployed Pages site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the library
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          mkdir -p _site/vendor
          cp -r dist/. _site/vendor/
          # Pages runs Jekyll by default, which strips files and folders beginning with `_`.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
